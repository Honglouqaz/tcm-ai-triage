# Cloudflare Worker 部署配置
#
# ── 这个文件解决什么问题 ──────────────────────────────────────
# 之前仓库里没有任何 wrangler 配置，意味着「照着 README 做也部署不起来」。
# 这里把所有绑定一次写清：KV（知识库 + LLM 配置）和 Workers AI（默认免费模型）。
#
# ── 三步部署 ─────────────────────────────────────────────────
#   npm i -g wrangler && wrangler login
#   wrangler kv namespace create TCM_KV        # 拿到 id，填到下面
#   node tools/upload_kv.mjs                    # 知识库灌进 KV
#   wrangler deploy
#
# ── 关于知识库放哪 ───────────────────────────────────────────
# 结构化的证型/方剂/中药（rules/*.json，约 160KB）编译进代码即可，够小、够快。
# 古籍全文（rules/classics/，73 万字）走 KV：它体积大、更新少、按需读，
# 塞进 Worker 只会让每次冷启动都背着 2MB。

name = "tcm-ai-triage"
main = "src/worker/tcm_worker_v3.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态前端（app/web 构建产物）
[assets]
directory = "./app/web"
binding = "ASSETS"

# ── KV：知识库 + 用户自带的 LLM 配置 ─────────────────────────
# 执行 `wrangler kv namespace create TCM_KV` 后把返回的 id 填进来。
# 不填也能跑——代码会在 KV 缺失时自动回退到内置规则库。
[[kv_namespaces]]
binding = "TCM_KV"
# id = "<运行 wrangler kv namespace create TCM_KV 后得到>"
preview_id = ""

# ── Workers AI：默认免费模型 ─────────────────────────────────
# 绑定后即使不配任何 API key 也能辨证（用的是 CF 免费额度）。
[ai]
binding = "AI"

# ── 环境变量 ─────────────────────────────────────────────────
[vars]
LLM_PROVIDER = "workers-ai"   # workers-ai | external | rules
# 想用别的模型？下面留空即可，改用 KV 里的 tcm:config:llm 覆盖，
# 这样 key 不会进 git：
#   wrangler kv key put --binding=TCM_KV "tcm:config:llm" \
#     '{"provider":"external","external_base":"https://api.deepseek.com/v1",
#       "external_key":"sk-你的key","external_model":"deepseek-chat"}'

# ── 本地开发（wrangler dev）─────────────────────────────────
[dev]
port = 8787
local_protocol = "http"
