name: Build Apps (Android / Windows / Linux)

# 三平台产物全部在云端构建：本机不需要 Android SDK / JDK / Wine，产物可复现。
# push 到 main 或手动触发 → 构建并上传 artifact；打 v* 标签 → 自动建 Release 并附上三个安装包。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Engine self-test
        working-directory: app
        run: npm run test:engine
      - name: Build
        working-directory: app
        run: npx electron-builder --linux AppImage deb --publish never
        env: { GH_TOKEN: '' }
      - name: List output
        working-directory: app
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-deb
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: app
        run: npx electron-builder --win nsis portable --publish never
      - name: List output
        working-directory: app
        run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            app/dist/*.exe
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
      - name: Install deps
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Prepare web assets
        working-directory: app
        run: npm run prepare:web
      - name: Add / sync Android platform
        working-directory: app
        run: |
          if [ ! -d android ]; then npx cap add android; else npx cap sync android; fi
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Show files
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: 四时辨证 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
            body: |
              ## 四时辨证 ${{ github.ref_name }} — 中医辨证与调理工具

              **默认纯本地推理**：规则引擎在你设备上跑，不联网、不调大模型，断网可用，
              每条结论可追溯到具体条目与权重。

              **可选接 AI**：想让它用自然语言解释辨证过程，可以填自己的模型接口
              （DeepSeek / 通义 / Moonshot / 硅基流动，或本地跑的 Ollama / LM Studio）。
              配置只存本机，不进 git、不上传。不配也能完整使用——规则引擎不依赖 AI。

              | 平台 | 文件 | 说明 |
              |---|---|---|
              | Android | `app-debug.apk` | 直接安装（debug 签名，测试用）|
              | Windows | `四时辨证 Setup *.exe` / `portable*.exe` | 安装版 / 免安装版 |
              | Linux | `*.AppImage` / `*.deb` | `chmod +x *.AppImage` 双击运行 |

              **本版内容**

              - **家庭健康档案**：多成员建档，体检/化验/症状/用药按时间线累积，
                同一指标自动成趋势。数据只存本机 IndexedDB，可导出 JSON + 纯文本。
              - **就医等级判断**：输入症状（可选化验值/年龄/持续天数），给出
                **观察 / 门诊 / 急诊** 三级结论 + 判断依据 + 挂什么科。
                11 条红旗症状、8 项化验危急值、12 条门诊判据，高危人群自动升级。
                **宁可高一级**——白跑一趟的代价远小于该去没去。
              - **知识库全部公开**：9 体质 · 47 证型 · 76 症状 · 54 味中药 · 73 首方剂 ·
                23 项化验指标，另有 8 部古籍全文（73 万字，公有领域）。
                规则数据是可读 JSON，换教材口径不用改代码。

              > ⚠️ **免责**：本工具为中医知识整理与参考，**不是医疗器械，不提供医疗建议**。
              > 体质辨识、证型匹配、化验解读、就医分级都是规则推理的参考，
              > 不能替代执业医师的面诊。方剂与用药必须由执业中医师面诊后决定。
              > 出现胸痛、呼吸困难、意识改变、单侧肢体无力等表现，**请立即拨打 120**。
              > 完整条款见 DISCLAIMER.md。

              > 💼 **商业使用请联系作者**：个人学习、教学、非商业自用完全自由。
              > 要做成付费产品 / SaaS / 企业内系统 / 白标贴牌，请先在 Issues 提 [商业授权]。
              > 源代码 MIT 可自由商用；规则与知识库数据为 CC BY-NC-SA 4.0，商业使用需授权。
          files: |
            artifacts/**/*.apk
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
